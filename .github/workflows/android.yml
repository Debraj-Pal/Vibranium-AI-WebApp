name: Capacitor Android Build

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Sync Capacitor & Build Android Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Node Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add or Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform directory missing, adding Capacitor Android..."
            npx cap add android
          fi
          mkdir -p android/gradle/wrapper
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing or empty. Fetching Gradle Wrapper JAR..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar || true
          fi
          if [ -f "android/gradlew" ]; then
            sed -i 's/\r$//' android/gradlew || true
            chmod +x android/gradlew || true
          fi
          echo "Syncing Capacitor plugins and web assets..."
          npx cap sync android

      - name: Setup Keystore for Android Signing
        id: setup_keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            mkdir -p android/app
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "HAS_KEYSTORE=true" >> $GITHUB_OUTPUT
          else
            echo "No keystore secret detected. Unsigned / Debug keystore will be used."
            echo "HAS_KEYSTORE=false" >> $GITHUB_OUTPUT
          fi

      - name: Grant Execute Permission & Ensure Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing or empty. Fetching Gradle Wrapper JAR..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar || true
          fi
          if [ -f "android/gradlew" ]; then
            sed -i 's/\r$//' android/gradlew || true
            chmod +x android/gradlew || true
          fi

      - name: Build Debug APK
        run: |
          cd android
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          cd android
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true
          if [ "${{ steps.setup_keystore.outputs.HAS_KEYSTORE }}" = "true" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=app/release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_STORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            ./gradlew assembleRelease
          fi

      - name: Build Release App Bundle (AAB)
        run: |
          cd android
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true
          if [ "${{ steps.setup_keystore.outputs.HAS_KEYSTORE }}" = "true" ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=app/release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_STORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            ./gradlew bundleRelease
          fi

      - name: Locate and Prepare Android Artifacts
        run: |
          mkdir -p build-output/apk build-output/aab build-output/logs
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/apk/ \; || true
          find android/app/build/outputs/bundle/ -name "*.aab" -exec cp {} build-output/aab/ \; || true
          ls -la build-output/apk/
          ls -la build-output/aab/

      - name: Upload Android APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibranium-android-apks
          path: build-output/apk/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibranium-android-aab
          path: build-output/aab/
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate Android Build Summary
        if: always()
        run: |
          echo "### 📱 Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ Succeeded' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing Mode**: \`${{ steps.setup_keystore.outputs.HAS_KEYSTORE == 'true' && 'Release Signed' || 'Debug Unsigned' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts Uploaded**: \`vibranium-android-apks\`, \`vibranium-android-aab\`" >> $GITHUB_STEP_SUMMARY
