name: 'Vercel Web Deployment'

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-vercel:
    name: Deploy Web Application to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Check Vercel Token Availability
        id: check_token
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "HAS_TOKEN=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_TOKEN=false" >> $GITHUB_OUTPUT
            echo "⚠️ VERCEL_TOKEN secret is not configured. Vercel CLI step skipped."
            echo "Note: If Vercel GitHub app is connected, Vercel will deploy automatically."
          fi

      - name: Install Vercel CLI
        if: steps.check_token.outputs.HAS_TOKEN == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check_token.outputs.HAS_TOKEN == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts via Vercel
        if: steps.check_token.outputs.HAS_TOKEN == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        if: steps.check_token.outputs.HAS_TOKEN == 'true'
        id: deploy
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Generate Vercel Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Vercel Deployment Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_token.outputs.HAS_TOKEN }}" = "true" ]; then
            echo "- **Status**: ${{ job.status == 'success' && '✅ Deployed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment**: \`${{ github.ref_name == 'main' && 'Production' || 'Preview' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Deployment URL**: [${{ steps.deploy.outputs.DEPLOY_URL }}](${{ steps.deploy.outputs.DEPLOY_URL }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ℹ️ Skipped (Missing \`VERCEL_TOKEN\` Secret)" >> $GITHUB_STEP_SUMMARY
            echo "- **Notice**: Add \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, and \`VERCEL_PROJECT_ID\` to GitHub Secrets for direct CLI deployment." >> $GITHUB_STEP_SUMMARY
          fi
