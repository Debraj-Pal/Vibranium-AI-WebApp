name: Release & Tag Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Node Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run Type Checks
        run: npx tsc --noEmit

      - name: Build Web Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          mkdir -p android/gradle/wrapper
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ] || [ ! -s "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "gradle-wrapper.properties missing or empty. Writing properties..."
            cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          fi
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing or empty. Fetching Gradle Wrapper JAR..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar || true
          fi
          if [ -f "android/gradlew" ]; then
            sed -i 's/\r$//' android/gradlew || true
            chmod +x android/gradlew || true
          fi
          npx cap sync android

      - name: Setup Keystore for Android Signing
        id: setup_keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            mkdir -p android/app
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "HAS_KEYSTORE=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK & AAB
        run: |
          cd android
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ] || [ ! -s "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "gradle-wrapper.properties missing or empty. Writing properties..."
            cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing. Fetching JAR..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar || true
          fi
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true
          if [ "${{ steps.setup_keystore.outputs.HAS_KEYSTORE }}" = "true" ]; then
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=app/release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_STORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            ./gradlew assembleRelease bundleRelease
          fi

      - name: Collect Release Artifacts
        run: |
          mkdir -p release-assets
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.version_tag }}"
          fi
          
          # Find and copy release APK & AAB
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-assets/VibraniumAI-${TAG_NAME}.apk \; || true
          find android/app/build/outputs/bundle/release/ -name "*.aab" -exec cp {} release-assets/VibraniumAI-${TAG_NAME}.aab \; || true
          
          # Fallback copy if named differently
          if [ ! -f "release-assets/VibraniumAI-${TAG_NAME}.apk" ]; then
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-assets/VibraniumAI-${TAG_NAME}.apk \; || true
          fi
          if [ ! -f "release-assets/VibraniumAI-${TAG_NAME}.aab" ]; then
            find android/app/build/outputs/bundle/ -name "*.aab" -exec cp {} release-assets/VibraniumAI-${TAG_NAME}.aab \; || true
          fi

          ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vibranium AI Release ${{ github.ref_name }}
          body: |
            ## 🚀 Vibranium AI Production Release ${{ github.ref_name }}

            ### What's Changed
            Automated production build generated by GitHub Actions.

            ### Downloads
            - **Android APK**: `VibraniumAI-${{ github.ref_name }}.apk`
            - **Android App Bundle (AAB)**: `VibraniumAI-${{ github.ref_name }}.aab`

            ---
            *Built with React, TypeScript, Tailwind CSS, Capacitor, & Vercel.*
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
