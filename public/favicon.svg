<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Square -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  
  <!-- Atom Nucleus & Orbits -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Central Nucleus -->
    <circle cx="256" cy="256" r="36" fill="#ffffff" />
    <!-- Horizontal Orbit -->
    <ellipse cx="256" cy="256" rx="164" ry="62" />
    <!-- 60deg Rotated Orbit -->
    <ellipse cx="256" cy="256" rx="164" ry="62" transform="rotate(60 256 256)" />
    <!-- 120deg Rotated Orbit -->
    <ellipse cx="256" cy="256" rx="164" ry="62" transform="rotate(120 256 256)" />
  </g>
</svg>
